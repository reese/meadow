{% extends "base.html" %}
{% block content %}
<h1>Class and module list</h1>
<ul class="object-list">
{% for item in classes %}
  <li><a href="{{ item.url }}">{{ item.path }}</a> <span class="kind">{{ item.kind }}</span>{% if item.summary %} — {{ item.summary }}{% endif %}</li>
{% endfor %}
</ul>
{% endblock %}
