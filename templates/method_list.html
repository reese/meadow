{% extends "base.html" %}
{% block content %}
<h1>Method list</h1>
<ul class="object-list">
{% for item in methods %}
  <li><a href="{{ item.url }}">{{ item.path }}</a> <span class="kind">{{ item.scope }}</span> <span class="owner">in <a href="{{ item.owner_url }}">{{ item.owner_name }}</a></span></li>
{% endfor %}
</ul>
{% endblock %}
