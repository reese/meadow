<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ site_title }}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="site-title" href="index.html">{{ site_title }}</a>
    <div class="search-box">
      <label for="search">Search</label>
      <input id="search" type="search" autocomplete="off" placeholder="Classes, methods, constants…">
      <div id="search-results" role="listbox"></div>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Documentation navigation">
      <a href="index.html">Overview</a>
      <a href="top_level.html">Top Level</a>
      <a href="class_list.html">Classes</a>
      <a href="method_list.html">Methods</a>
      <a href="file_list.html">Files</a>
      <a href="undocumented.html">Undocumented</a>
    </nav>
    <main id="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% if timestamp %}<footer class="timestamp">{{ timestamp }}</footer>{% endif %}
  <script src="search.js"></script>
</body>
</html>
